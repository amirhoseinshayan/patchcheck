[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "patchcheck-framework"
version = "1.0.9"
description = "Evidence-preserving security-patch validation framework"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.23.0"]

[project.scripts]
patchcheck = "patchcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchcheck = ["schemas/*.json", "resources/*"]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.4",
  "mutmut>=3.1",
]

[tool.coverage.run]
branch = true
source = ["patchcheck"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
